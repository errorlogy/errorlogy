# Harness spec — Scout agent (case extraction)
# Copied from docs/reference/harness-engineering/templates/harness-spec.yaml

schema_version: "1.0"

agent:
  id: scout
  module: mas.agents.scout
  pipeline_step: 1
  llm_required: true

harness:
  description: |
    Extract structured GovernanceCase from raw governance event text.
    First LLM step in the full pipeline; skipped on engine_only (heuristic WMS fallback).
  inputs:
    - name: raw_text
      from: api_analyze_request
    - name: case_id
      from: api_analyze_request
    - name: title
      from: api_analyze_request
    - name: country
      from: api_analyze_request
    - name: year
      from: api_analyze_request
  outputs:
    schema: mas.schemas.case.GovernanceCase
    required_fields:
      - case_id
      - title
      - description
      - weak_signals

eval_layers:
  L1_deterministic:
    ci: always
    tests:
      - assert: output_schema_valid
      - assert: field_exists
        field: weak_signals
  L2_engine_only:
    ci: always
    note: Scout skipped when engine_only=True; orchestrator uses _heuristic_weak_signals
  L4_live_llm:
    ci: manual_or_nightly
    threshold: 0.8
    runs: 3
    cases_ref: seeds/scout_extraction.yaml  # future — data/calibration_targets.json seeds

graders:
  deterministic:
    - type: schema
    - type: field_count_min
      field: weak_signals
      min: 1
  llm_judge:
    enabled: false
    rubric: |
      Score 1 if extraction is analytical, no legal accusations, weak_signals plausible.
    model: null

invariants:
  - mu_is_not_probability
  - no_legal_accusation_without_evidence
  - language_rules_from_agents_base

oss_tool_binding: pytest-agent-eval
funnel:
  stage: discover
  candidate_id: pytest-agent-eval

metadata:
  owner: mas
  last_reviewed: "2026-06-15"
  related_tests:
    - errorlogy-mas/tests/test_challenger_smoke.py
    - errorlogy-mas/tests/test_api_analyze.py
