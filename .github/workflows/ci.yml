name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  mas:
    name: errorlogy-mas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: errorlogy-mas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: errorlogy-mas/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -q --tb=short -m "not llm_eval"

      - name: Engine-only smoke (Challenger)
        run: python examples/run_challenger.py --engine-only

  gui:
    name: errorlogy-gui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: errorlogy-gui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: errorlogy-gui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
