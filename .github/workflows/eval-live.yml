# Manual live LLM eval workflow (non-blocking — not run on every PR).
# Trigger via Actions → Eval Live → Run workflow.
#
# Required GitHub secrets (repository settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY, OPENAI_API_KEY, OPENROUTER_API_KEY, GOOGLE_API_KEY,
#   DEEPSEEK_API_KEY, GROQ_API_KEY, KIMI_API_KEY (subset OK — router falls back)
#
# Default CI (ci.yml) remains keyless.

name: Eval Live

on:
  workflow_dispatch:
    inputs:
      test_path:
        description: Pytest path or marker expression
        required: false
        default: "tests/evals/test_neutrality_live.py"

jobs:
  neutrality-live:
    name: Neutrality live eval (EVAL_LIVE=1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: errorlogy-mas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: errorlogy-mas/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live eval
        env:
          EVAL_LIVE: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: pytest ${{ inputs.test_path }} -m llm_eval -v --tb=short
